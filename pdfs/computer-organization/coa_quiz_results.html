<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quiz Results - Teacher View</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;background:#f4f6f9;color:#1c2530;padding:20px;}
  .wrap{max-width:800px;margin:0 auto;}
  h1{font-size:20px;}
  table{width:100%;border-collapse:collapse;background:#fff;border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(20,30,50,0.04);}
  th,td{padding:10px 12px;text-align:left;font-size:13px;border-bottom:1px solid #e1e5ea;}
  th{background:#eef1f6;color:#5b6672;font-weight:600;}
  tr:last-child td{border-bottom:none;}
  button{background:#2f5fd8;color:#fff;border:none;border-radius:8px;padding:10px 16px;font-size:14px;cursor:pointer;margin-bottom:16px;}
  .empty{color:#5b6672;font-size:14px;padding:20px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Computer Organization & Architecture — submissions</h1>
  <button onclick="loadResults()">Refresh</button>
  <div id="content"><div class="empty">Loading...</div></div>
</div>
<script>
async function loadResults(){
  const content = document.getElementById('content');
  content.innerHTML = '<div class="empty">Loading...</div>';
  try{
    const list = await window.storage.list('submission:', true);
    if(!list || !list.keys || list.keys.length === 0){
      content.innerHTML = '<div class="empty">No submissions yet.</div>';
      return;
    }
    const records = [];
    for(const key of list.keys){
      try{
        const r = await window.storage.get(key, true);
        if(r) records.push(JSON.parse(r.value));
      }catch(e){}
    }
    records.sort((a,b)=> new Date(b.submittedAt) - new Date(a.submittedAt));
    let html = '<table><tr><th>Name</th><th>Roll</th><th>Email</th><th>Score</th><th>Submitted</th></tr>';
    records.forEach(r=>{
      html += `<tr><td>${r.name}</td><td>${r.roll}</td><td>${r.email||'-'}</td><td>${r.score}/${r.maxScore}</td><td>${new Date(r.submittedAt).toLocaleString()}</td></tr>`;
    });
    html += '</table>';
    content.innerHTML = html;
  }catch(e){
    content.innerHTML = '<div class="empty">Could not load submissions.</div>';
  }
}
loadResults();
</script>
</body>
</html>
